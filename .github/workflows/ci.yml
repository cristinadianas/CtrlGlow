# Checks every push and pull request: types, tests (with a coverage floor) and the UI build.
# The tests need no hardware, OpenRGB or running Lumen: they use temporary folders, free local ports and a fake
# OpenRGB server. Windows is the platform Lumen runs on; Linux catches anything that only works by accident there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage floor)
        run: npm run test:coverage

      - name: Build the UI
        run: npm run build
